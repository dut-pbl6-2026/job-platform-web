server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same headers as vercel.json. script-src 'self' blocks injected inline/third-party scripts,
  # the main way an XSS would read the tokens kept in localStorage. No default-src: the API
  # host differs per deployment (VITE_API_BASE_URL).
  add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;
}
